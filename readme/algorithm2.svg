<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="590" viewBox="0 0 1400 590" role="img" aria-labelledby="title desc">
  <title id="title">Algorithm 2: Simulation 1 Monte Carlo study</title>
  <desc id="desc">Pseudocode for the parametric Monte Carlo study.</desc>
  <rect width="1400" height="590" fill="#ffffff"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#111111">
    <line x1="24" y1="24" x2="1376" y2="24" stroke="#111111" stroke-width="2"/>
    <text x="36" y="56" font-size="25"><tspan font-weight="700">Algorithm 2</tspan><tspan>  Simulation 1: parametric Monte Carlo study</tspan></text>
    <line x1="24" y1="72" x2="1376" y2="72" stroke="#111111" stroke-width="1.4"/>

    <text x="36" y="108" font-size="21"><tspan font-weight="700">Input:</tspan><tspan> Replicates B; trial and auxiliary sample-size grid; outcome and selection model specifications.</tspan></text>
    <text x="36" y="142" font-size="21"><tspan font-weight="700">Output:</tspan><tspan> Monte Carlo summaries and figures for Naive and Proposed G-formula, IPW, and AIPW.</tspan></text>
    <line x1="24" y1="164" x2="1376" y2="164" stroke="#111111" stroke-width="1.4"/>

    <g font-size="21">
      <g fill="#555555" text-anchor="end">
        <text x="68" y="202">1:</text><text x="68" y="241">2:</text><text x="68" y="280">3:</text>
        <text x="68" y="319">4:</text><text x="68" y="358">5:</text><text x="68" y="397">6:</text>
        <text x="68" y="436">7:</text><text x="68" y="475">8:</text><text x="68" y="514">9:</text>
        <text x="68" y="553">10:</text>
      </g>
      <text x="88" y="202"><tspan font-weight="700">for</tspan><tspan> each (n</tspan><tspan baseline-shift="sub" font-size="15">trial</tspan><tspan>, n</tspan><tspan baseline-shift="sub" font-size="15">aux</tspan><tspan>) combination </tspan><tspan font-weight="700">do</tspan></text>
      <text x="126" y="241"><tspan font-weight="700">for</tspan><tspan> replicate b = 1,鈥?B </tspan><tspan font-weight="700">do</tspan></text>
      <text x="164" y="280"><tspan font-weight="700">Generate</tspan><tspan> trial and auxiliary samples from the parametric data-generating process.</tspan></text>
      <text x="164" y="319"><tspan font-weight="700">for</tspan><tspan> each outcome/selection model specification </tspan><tspan font-weight="700">do</tspan></text>
      <text x="202" y="358"><tspan font-weight="700">Fit</tspan><tspan> Naive and Proposed G-formula, IPW, and AIPW estimators.</tspan></text>
      <text x="202" y="397"><tspan font-weight="700">Store</tspan><tspan> 畏虃(0), 畏虃(1), RD, RR, and estimated variances.</tspan></text>
      <text x="164" y="436" font-weight="700">end for</text>
      <text x="126" y="475" font-weight="700">end for</text>
      <text x="88" y="514" font-weight="700">end for</text>
      <text x="88" y="553"><tspan font-weight="700">Summarize</tspan><tspan> bias, variance, MSE, and 95% CI coverage; save the table and figures.</tspan></text>
    </g>
    <line x1="24" y1="576" x2="1376" y2="576" stroke="#111111" stroke-width="2"/>
  </g>
</svg>

