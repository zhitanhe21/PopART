<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img" aria-labelledby="title desc">
  <title id="title">Algorithm 3: Simulation 2 Monte Carlo study</title>
  <desc id="desc">Pseudocode for the HAL Monte Carlo study with global scheduling.</desc>
  <rect width="1400" height="640" fill="#ffffff"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#111111">
    <line x1="24" y1="24" x2="1376" y2="24" stroke="#111111" stroke-width="2"/>
    <text x="36" y="56" font-size="25"><tspan font-weight="700">Algorithm 3</tspan><tspan>  Simulation 2: HAL Monte Carlo study with global scheduling</tspan></text>
    <line x1="24" y1="72" x2="1376" y2="72" stroke="#111111" stroke-width="1.4"/>

    <text x="36" y="108" font-size="21"><tspan font-weight="700">Input:</tspan><tspan> Replicates B; sample-size grid; HAL settings; available CPU workers.</tspan></text>
    <text x="36" y="142" font-size="21"><tspan font-weight="700">Output:</tspan><tspan> Monte Carlo summaries and figures for Naive and Proposed AIPW.</tspan></text>
    <line x1="24" y1="164" x2="1376" y2="164" stroke="#111111" stroke-width="1.4"/>

    <g font-size="21">
      <g fill="#555555" text-anchor="end">
        <text x="68" y="202">1:</text><text x="68" y="241">2:</text><text x="68" y="280">3:</text>
        <text x="68" y="319">4:</text><text x="68" y="358">5:</text><text x="68" y="397">6:</text>
        <text x="68" y="436">7:</text><text x="68" y="475">8:</text><text x="68" y="514">9:</text>
        <text x="68" y="553">10:</text><text x="68" y="592">11:</text>
      </g>
      <text x="88" y="202"><tspan font-weight="700">Detect</tspan><tspan> available CPU workers and create one global worker pool.</tspan></text>
      <text x="88" y="241"><tspan font-weight="700">for</tspan><tspan> each sample-size combination </tspan><tspan font-weight="700">do</tspan></text>
      <text x="126" y="280"><tspan font-weight="700">for</tspan><tspan> each batch of active Monte Carlo replicates </tspan><tspan font-weight="700">do</tspan></text>
      <text x="164" y="319"><tspan font-weight="700">Generate</tspan><tspan> nonlinear trial and auxiliary samples for each replicate.</tspan></text>
      <text x="164" y="358"><tspan font-weight="700">Prepare</tspan><tspan> four HAL jobs per replicate: 渭虃, 蟺虃</tspan><tspan baseline-shift="sub" font-size="15">C</tspan><tspan>, q虃</tspan><tspan baseline-shift="sub" font-size="15">0</tspan><tspan>, and q虃</tspan><tspan baseline-shift="sub" font-size="15">1</tspan><tspan>.</tspan></text>
      <text x="164" y="397"><tspan font-weight="700">Dispatch</tspan><tspan> all HAL jobs through the global worker pool.</tspan></text>
      <text x="164" y="436"><tspan font-weight="700">Reuse</tspan><tspan> the four fitted models for Naive and Proposed AIPW.</tspan></text>
      <text x="164" y="475"><tspan font-weight="700">Store</tspan><tspan> RD estimates and estimated variances.</tspan></text>
      <text x="126" y="514" font-weight="700">end for</text>
      <text x="88" y="553" font-weight="700">end for</text>
      <text x="88" y="592"><tspan font-weight="700">Summarize</tspan><tspan> empirical variance and 95% CI coverage; save the table and figures.</tspan></text>
    </g>
    <line x1="24" y1="620" x2="1376" y2="620" stroke="#111111" stroke-width="2"/>
  </g>
</svg>

